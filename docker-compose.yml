services:
    portainer:
        image: portainer/portainer-ce:lts
        container_name: portainer
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer-data:/data
        ports:
            - "10.0.0.1:8000:8000"
            - "10.0.0.1:9443:9443"

    traefik:
        image: traefik:v3.4
        container_name: traefik
        networks:
            - prod
        ports:
            - "80:80"
            - "443:443"
            - "10.0.0.1:8080:8080"
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./letsencrypt:/letsencrypt
            - ./traefik:/etc/traefik

    trilium:
        image: triliumnext/notes:latest
        container_name: trilium-sync
        networks:
            - prod
        restart: unless-stopped
        volumes:
            - ${trilium_data_dir:-./trilium-data}:/home/node/trilium-data
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.trilium.rule=host(`notes.slobodausisivac.rocks`)"
            - "traefik.http.routers.trilium.tls=true"
            - "traefik.http.routers.trilium.tls.certresolver=letsencrypt"

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        depends_on:
            - prometheus
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
        ports:
            - "10.0.0.1:3000:3000"
        volumes:
            - grafana-data:/var/lib/grafana
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        ports:
            - "10.0.0.1:9090:9090"
        restart: unless-stopped

    node-exporter:
        image: quay.io/prometheus/node-exporter:latest
        container_name: node-exporter
        command:
            - "--path.rootfs=/host"
        pid: host
        restart: unless-stopped
        volumes:
            - "/:/host:ro,rslave"

    jenkins:
        image: jenkins/jenkins:lts
        container_name: jenkins
        networks:
            - prod
        volumes:
            - jenkins-data:/var/jenkins_home
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.jenkins.rule=host(`jenkins.slobodausisivac.rocks`)"
            - "traefik.http.routers.jenkins.tls=true"
            - "traefik.http.routers.jenkins.tls.certresolver=letsencrypt"

    matrix:
        image: matrixdotorg/synapse:latest
        container_name: matrix
        networks:
            - prod
        volumes:
            - ./matrix/data:/data
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.matrix.rule=Host(`matrix.slobodausisivac.rocks`)"
            - "traefik.http.routers.matrix.entrypoints=websecure"
            - "traefik.http.routers.matrix.tls.certresolver=letsencrypt"
        environment:
            - SYNAPSE_SERVER_NAME=matrix.slobodausisivac.rocks
            - SYNAPSE_REPORT_STATS=yes

volumes:
    db-data:
    prometheus-data:
    grafana-data:
    portainer-data:
    jenkins-data:


networks:
    prod:
        name: prod-network
        driver: bridge
