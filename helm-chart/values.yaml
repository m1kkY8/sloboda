# Global configuration
global:
  domain: slobodausisivac.rocks
  storageClass: local-path # K3s default storage class
  timezone: Europe/Belgrade

# Traefik configuration
traefik:
  enabled: true
  deployment:
    replicas: 1
  service:
    type: LoadBalancer
  ingressRoute:
    dashboard:
      enabled: true
  certificatesResolvers:
    letsencrypt:
      acme:
        email: 5rovicmilan89@gmail.com
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path

# Application configurations
portainer:
  enabled: true
  image:
    repository: portainer/portainer-ce
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    ports:
      http: 9000
      edge: 8000
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path
  ingress:
    enabled: true
    host: portainer.slobodausisivac.rocks
    tls: true

trilium:
  enabled: true
  image:
    repository: triliumnext/notes
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  ingress:
    enabled: true
    host: notes.slobodausisivac.rocks
    tls: true
  env:
    trilium_data_dir: /home/node/trilium-data

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  persistence:
    enabled: true
    size: 2Gi
    storageClass: local-path
  env:
    GF_SECURITY_ADMIN_PASSWORD: admin123 # Change this!
  ingress:
    enabled: true
    host: grafana.slobodausisivac.rocks
    tls: true

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  ingress:
    enabled: true
    host: prometheus.slobodausisivac.rocks
    tls: true

nodeExporter:
  enabled: true
  image:
    repository: quay.io/prometheus/node-exporter
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9100
  hostNetwork: true
  hostPID: true

jenkins:
  enabled: true
  image:
    repository: jenkins/jenkins
    tag: lts
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
  ingress:
    enabled: true
    host: jenkins.slobodausisivac.rocks
    tls: true

matrix:
  enabled: true
  image:
    repository: matrixdotorg/synapse
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8008
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  env:
    SYNAPSE_SERVER_NAME: matrix.slobodausisivac.rocks
    SYNAPSE_REPORT_STATS: "yes"
  ingress:
    enabled: true
    host: matrix.slobodausisivac.rocks
    tls: true
