{{- if .Values.jenkins.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sloboda-stack.fullname" . }}-jenkins
  labels:
    {{- include "sloboda-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sloboda-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jenkins
  template:
    metadata:
      labels:
        {{- include "sloboda-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jenkins
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
      - name: jenkins
        image: "{{ .Values.jenkins.image.repository }}:{{ .Values.jenkins.image.tag }}"
        imagePullPolicy: {{ .Values.jenkins.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50000
          name: agent
        env:
        - name: JAVA_OPTS
          value: "-Djenkins.install.runSetupWizard=false"
        volumeMounts:
        - name: data
          mountPath: /var/jenkins_home
        resources:
          limits:
            memory: "2Gi"
            cpu: "1000m"
          requests:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        {{- if .Values.jenkins.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "sloboda-stack.fullname" . }}-jenkins-data
        {{- else }}
        emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sloboda-stack.fullname" . }}-jenkins
  labels:
    {{- include "sloboda-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
spec:
  type: {{ .Values.jenkins.service.type }}
  ports:
  - port: {{ .Values.jenkins.service.port }}
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 50000
    targetPort: 50000
    protocol: TCP
    name: agent
  selector:
    {{- include "sloboda-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
{{- if .Values.jenkins.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sloboda-stack.fullname" . }}-jenkins-data
  labels:
    {{- include "sloboda-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.jenkins.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.jenkins.persistence.size }}
{{- end }}
{{- if .Values.jenkins.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sloboda-stack.fullname" . }}-jenkins
  labels:
    {{- include "sloboda-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  tls:
  - hosts:
    - {{ .Values.jenkins.ingress.host }}
    secretName: {{ include "sloboda-stack.fullname" . }}-jenkins-tls
  rules:
  - host: {{ .Values.jenkins.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "sloboda-stack.fullname" . }}-jenkins
            port:
              number: {{ .Values.jenkins.service.port }}
{{- end }}
{{- end }}
